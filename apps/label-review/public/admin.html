<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검수 진행 현황</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* index.html 과 같은 토큰. 여기서 새 색을 만들지 않는다 */
  :root {
    --bg:#0C0C0E; --fg:#FBFBFB; --fg2:#BDBDBD; --fg70:rgba(255,255,255,.7); --fg50:rgba(255,255,255,.5); --fg30:rgba(255,255,255,.3); --grey:#8C8C8C;
    --card:rgba(255,255,255,.04); --card2:rgba(255,255,255,.08); --card3:rgba(255,255,255,.12); --line:rgba(255,255,255,.08);
    --blue:#478BFF; --blue80:rgba(71,139,255,.8); --blue-bg:rgba(71,139,255,.15);
    --mint:#54ED91; --mint-bg:rgba(70,236,136,.13);
    --coral:#FF7A6B; --coral-bg:rgba(255,122,107,.14);
    --r:24px; --pill:100px;
  }
  * { box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body { margin:0; background-color:var(--bg); background-image:radial-gradient(900px 520px at 18% -10%, rgba(71,139,255,.22), transparent 70%), radial-gradient(700px 500px at 100% 40%, rgba(255,255,255,.05), transparent 70%); background-repeat:no-repeat; background-attachment:fixed; color:var(--fg); font:18px/1.6 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; letter-spacing:-0.5px; }
  button { font:inherit; letter-spacing:inherit; cursor:pointer; color:inherit; }
  header { position:sticky; top:16px; z-index:3; margin:16px auto 0; width:min(1100px, calc(100% - 32px)); height:64px; border-radius:var(--pill); background:rgba(0,0,0,.5); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); display:flex; align-items:center; gap:14px; padding:0 12px 0 28px; }
  header .left { display:flex; align-items:center; gap:14px; min-width:0; flex:1; }
  header .name { font-size:20px; font-weight:700; letter-spacing:0; white-space:nowrap; }
  header .tag { font-size:18px; color:var(--fg2); border-left:1px solid var(--line); padding-left:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .right { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .navpill { height:40px; padding:0 18px; border-radius:var(--pill); background:var(--card2); display:flex; align-items:center; gap:10px; font-size:16px; color:var(--fg2); border:0; }
  .navpill b { font-variant-numeric:tabular-nums; font-weight:600; color:var(--fg); }
  .navpill.white { background:#FBFBFB; color:#0C0C0E; font-weight:600; } .navpill.white:hover { background:#fff; }
  .navpill.ghost { background:transparent; border:1px solid rgba(255,255,255,.14); } .navpill.ghost:hover { background:var(--card2); }
  main { width:min(1100px, calc(100% - 32px)); margin:0 auto; padding:56px 0 120px; display:flex; flex-direction:column; gap:44px; }
  .fade { animation:fade .3s ease; } @keyframes fade { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }
  .track { display:flex; flex-direction:column; gap:18px; padding:0 8px; }
  h1.display { margin:0; font-size:clamp(30px, 4vw, 48px); line-height:1.3; font-weight:600; letter-spacing:-1.5px; color:var(--fg); text-wrap:pretty; }
  h1.display b { color:var(--blue); font-weight:600; }
  .sub { margin:0; font-size:18px; color:var(--fg50); }
  .pill { display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 16px; border-radius:var(--pill); font-size:16px; font-weight:500; background:var(--card2); color:var(--fg70); white-space:nowrap; }
  .pill.blue { background:var(--blue-bg); color:var(--blue); font-weight:700; letter-spacing:0; }
  /* 요약 카드 4개 */
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; }
  .stat { background:var(--card); border:1px solid rgba(255,255,255,.07); border-radius:var(--r); padding:26px 28px; display:flex; flex-direction:column; gap:6px; }
  .stat .k { font-size:15px; color:var(--fg50); font-weight:500; }
  .stat .v { font-size:44px; line-height:1.1; font-weight:600; letter-spacing:-2px; font-variant-numeric:tabular-nums; }
  .stat .v small { font-size:18px; color:var(--fg30); letter-spacing:-.5px; margin-left:4px; font-weight:500; }
  .stat.done .v { color:var(--mint); } .stat.active .v { color:var(--blue); } .stat.free .v { color:var(--fg2); } .stat.labels .v { color:var(--fg); }
  .stat .s { font-size:14px; color:var(--fg50); }
  /* 번들 그리드 */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:12px; }
  .b { background:var(--card); border:1px solid rgba(255,255,255,.07); border-radius:18px; padding:16px 16px 14px; display:flex; flex-direction:column; gap:8px; min-height:132px; position:relative; }
  .b::before { content:''; position:absolute; left:16px; top:16px; width:8px; height:8px; border-radius:50%; background:var(--grey); }
  .b.done::before { background:var(--mint); box-shadow:0 0 12px rgba(84,237,145,.6); }
  .b.active::before { background:var(--blue); box-shadow:0 0 12px rgba(71,139,255,.7); animation:pulse 1.6s ease-in-out infinite; }
  .b.expired::before { background:var(--coral); box-shadow:0 0 12px rgba(255,122,107,.6); }
  .b.done { border-color:rgba(84,237,145,.25); } .b.active { border-color:rgba(71,139,255,.4); background:var(--blue-bg); } .b.expired { border-color:rgba(255,122,107,.35); background:var(--coral-bg); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
  .b .id { padding-left:16px; font-size:14px; font-weight:700; letter-spacing:0; color:var(--fg70); display:flex; justify-content:space-between; align-items:center; }
  .b .id .st { font-size:12px; font-weight:600; color:var(--fg50); }
  .b.done .id .st { color:var(--mint); } .b.active .id .st { color:var(--blue); } .b.expired .id .st { color:var(--coral); }
  .b .nm { font-size:14px; line-height:1.4; color:var(--fg); font-weight:500; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .b .who { font-size:13px; color:var(--fg50); margin-top:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .b .who b { color:var(--fg2); font-weight:600; }
  .b .tags { display:flex; flex-wrap:wrap; gap:4px; }
  .tagc { height:24px; padding:0 8px; border-radius:6px; background:rgba(255,255,255,.04); box-shadow:inset 0 0 0 1px rgba(255,255,255,.04); color:var(--fg50); font-size:12px; font-weight:500; display:inline-flex; align-items:center; gap:4px; font-variant-numeric:tabular-nums; }
  .tagc.ok { color:var(--mint); } .tagc.ed { color:var(--blue); } .tagc.no { color:var(--coral); } .tagc.hu { color:var(--fg); }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:14px; color:var(--fg50); padding:0 8px; }
  .legend span::before { content:''; display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background:var(--grey); vertical-align:middle; }
  .legend .done::before { background:var(--mint); } .legend .active::before { background:var(--blue); } .legend .expired::before { background:var(--coral); }
  /* 라벨러 표 */
  .tbl { background:var(--card); border:1px solid rgba(255,255,255,.07); border-radius:var(--r); overflow:hidden; }
  .tbl table { width:100%; border-collapse:collapse; font-size:16px; }
  .tbl th, .tbl td { text-align:left; padding:14px 24px; border-bottom:1px solid var(--line); }
  .tbl th { font-size:13px; font-weight:600; color:var(--fg50); letter-spacing:0; }
  .tbl tr:last-child td { border-bottom:0; }
  .tbl td.num { font-variant-numeric:tabular-nums; font-weight:600; }
  .tbl td .pill { height:28px; font-size:14px; padding:0 12px; }
  .tbl .empty { color:var(--fg50); text-align:center; padding:32px; }
  /* 키 입력 */
  .gate { max-width:520px; margin:12vh auto 0; display:flex; flex-direction:column; gap:20px; }
  input { width:100%; font:inherit; letter-spacing:inherit; color:var(--fg); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:16px 18px; outline:none; }
  input:focus { border-color:var(--blue); background:var(--card3); }
  .btn { height:56px; padding:0 28px; border-radius:var(--pill); border:0; background:var(--blue); color:#fff; font-weight:600; font-size:17px; } .btn:hover { background:#5C98FF; }
  .err { color:var(--coral); font-size:15px; min-height:1.6em; }
  .note { font-size:14px; color:var(--fg30); padding:0 8px; }
  @media (max-width:640px) { header .tag { display:none; } .tbl th:nth-child(3), .tbl td:nth-child(3) { display:none; } }
</style>
</head>
<body>
<header>
  <div class="left"><span class="name">검수 진행 현황</span><span class="tag" id="hTag">관리자</span></div>
  <div class="right" id="hRight"></div>
</header>
<main id="main"></main>
<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STATE = { done:'완료', active:'진행 중', expired:'만료', free:'남음' };
const REFRESH_MS = 30000;
const S = { key:null, data:null, timer:null, fetchedAt:null, err:null };

function loadKey() { try { return localStorage.getItem('adminKey') || ''; } catch (e) { return ''; } }
function saveKey(k) { try { if (k) localStorage.setItem('adminKey', k); else localStorage.removeItem('adminKey'); } catch (e) {} }

async function fetchStatus() {
  const r = await fetch('/api/admin/status', { headers: { 'X-Admin-Key': S.key }, cache: 'no-store' });
  if (r.status === 403) throw Object.assign(new Error('관리자 키가 맞지 않아요'), { code: 403 });
  if (r.status === 404) throw Object.assign(new Error('서버에 LABEL_ADMIN_KEY 가 설정돼 있지 않아 관리자 화면이 닫혀 있어요'), { code: 404 });
  if (!r.ok) throw new Error(`서버 오류 (${r.status})`);
  return r.json();
}

// ---- 화면 1: 키 입력 ----
function renderGate(msg) {
  $('#hRight').innerHTML = '';
  $('#main').innerHTML = `
    <section class="gate fade">
      <span class="pill blue">관리자</span>
      <h1 class="display">진행 현황을 보려면<br><b>관리자 키</b>가 필요해요</h1>
      <p class="sub">서버 환경변수 LABEL_ADMIN_KEY 와 같은 값이에요. 이 브라우저에만 저장돼요.</p>
      <input id="key" type="password" placeholder="관리자 키" autocomplete="off" autofocus>
      <div class="err" id="err">${esc(msg || '')}</div>
      <button class="btn" id="go">열기</button>
    </section>`;
  const go = async () => {
    S.key = $('#key').value.trim();
    if (!S.key) { $('#err').textContent = '키를 입력해 주세요'; return; }
    try { S.data = await fetchStatus(); S.fetchedAt = new Date(); saveKey(S.key); start(); }
    catch (e) { $('#err').textContent = e.message; }
  };
  $('#go').onclick = go;
  $('#key').onkeydown = e => { if (e.key === 'Enter') go(); };
}

// ---- 화면 2: 현황 ----
function start() {
  render();
  clearInterval(S.timer);
  S.timer = setInterval(refresh, REFRESH_MS);
}

async function refresh() {
  try { S.data = await fetchStatus(); S.fetchedAt = new Date(); S.err = null; }
  catch (e) {
    if (e.code === 403) { clearInterval(S.timer); saveKey(''); return renderGate('키가 더 이상 맞지 않아요. 다시 입력해 주세요'); }
    S.err = e.message;
  }
  render();
}

function logout() { clearInterval(S.timer); S.key = null; S.data = null; saveKey(''); renderGate(); }

const hhmm = d => d ? d.toTimeString().slice(0, 8) : '—';

function bundleCard(b) {
  const d = b.decisions || {};
  const who = b.assignment ? `<b>${esc(b.assignment.labelerName || b.assignment.labelerId)}</b>` : (b.state === 'done' ? '손으로 만든 라벨' : '아직 아무도');
  const tags = [
    d.accept ? `<span class="tagc ok">맞아요 ${d.accept}</span>` : '',
    d.edit ? `<span class="tagc ed">고침 ${d.edit}</span>` : '',
    d.reject ? `<span class="tagc no">아니에요 ${d.reject}</span>` : '',
    d.human ? `<span class="tagc hu">추가 ${d.human}</span>` : '',
    d.no_missed ? `<span class="tagc">없어요</span>` : '',
    `<span class="tagc">라벨 ${b.labels}/${b.candidateCount}</span>`,
  ].join('');
  return `<div class="b ${b.state}" title="${esc(b.displayName)} · 리뷰 ${b.reviewCount}건 · 후보 ${b.candidateCount}개">
    <div class="id"><span>${esc(b.bundleId)}</span><span class="st">${STATE[b.state] || b.state}</span></div>
    <div class="nm">${esc(b.displayName)}</div>
    <div class="tags">${tags}</div>
    <div class="who">${who}</div>
  </div>`;
}

function render() {
  const d = S.data, s = d.summary;
  $('#hTag').textContent = `${s.doneBundles} / ${s.totalBundles} 번들 완료`;
  $('#hRight').innerHTML = `
    <span class="navpill" id="clock">${S.err ? '갱신 실패' : '갱신'} <b>${hhmm(S.fetchedAt)}</b></span>
    <button class="navpill white" id="btnRefresh">새로고침</button>
    <button class="navpill ghost" id="btnOut">키 지우기</button>`;
  $('#btnRefresh').onclick = refresh;
  $('#btnOut').onclick = logout;

  const pct = s.totalBundles ? Math.round(100 * s.doneBundles / s.totalBundles) : 0;
  const labelers = s.labelers || [];
  $('#main').innerHTML = `
    <section class="track fade">
      <span class="pill blue">골든셋 라벨링 · PER-178</span>
      <h1 class="display">번들 ${s.totalBundles}개 중 <b>${s.doneBundles}개</b> 끝났어요 <span style="color:var(--fg30)">· ${pct}%</span></h1>
      <p class="sub">${S.err ? `<span style="color:var(--coral)">${esc(S.err)} — 마지막으로 받은 자료를 보여드려요.</span>` : `30초마다 자동으로 새로 받아요. 서버 기준 ${esc(d.generatedAt || '')}`}</p>
    </section>
    <section class="stats fade">
      <div class="stat done"><span class="k">완료</span><span class="v">${s.doneBundles}<small>/ ${s.totalBundles}</small></span><span class="s">배정 완료 또는 라벨 + 놓친 질문 답변</span></div>
      <div class="stat active"><span class="k">진행 중</span><span class="v">${s.activeBundles}</span><span class="s">${s.expiredBundles ? `만료 ${s.expiredBundles}개 별도` : '지금 누군가 보고 있는 번들'}</span></div>
      <div class="stat free"><span class="k">남음</span><span class="v">${s.freeBundles}</span><span class="s">아직 아무도 잡지 않은 번들</span></div>
      <div class="stat labels"><span class="k">라벨 수</span><span class="v">${s.totalLabels}</span><span class="s">그중 사람이 직접 만든 claim ${s.humanLabels}</span></div>
    </section>
    <section class="track fade" style="gap:14px">
      <div class="legend"><span class="done">완료</span><span class="active">진행 중</span><span class="expired">만료</span><span>남음</span></div>
      <div class="grid" style="padding:0">${d.bundles.map(bundleCard).join('')}</div>
      <p class="note">카드의 "라벨 a/b" 는 저장된 라벨 수 / 모델 후보 수. 기각인데 인용이 원문과 달라 라벨이 안 된 건은 결정 수에만 남아요.</p>
    </section>
    <section class="track fade" style="gap:14px">
      <span class="pill">라벨러 ${labelers.length}명</span>
      <div class="tbl" style="padding:0"><table>
        <thead><tr><th>이름</th><th>완료 번들</th><th>ID</th><th>지금 보는 번들</th></tr></thead>
        <tbody>${labelers.length ? labelers.map(p => `<tr>
          <td>${esc(p.name)}</td>
          <td class="num">${p.doneBundles}</td>
          <td style="color:var(--fg50);font-size:14px">${esc(p.labelerId)}</td>
          <td>${p.activeBundle ? `<span class="pill blue">${esc(p.activeBundle)}</span>` : '<span style="color:var(--fg30)">—</span>'}</td>
        </tr>`).join('') : '<tr><td colspan="4" class="empty">아직 참여한 사람이 없어요</td></tr>'}</tbody>
      </table></div>
    </section>`;
}

// ---- 진입 ----
(async () => {
  S.key = loadKey();
  if (!S.key) return renderGate();
  try { S.data = await fetchStatus(); S.fetchedAt = new Date(); start(); }
  catch (e) { saveKey(''); renderGate(e.message); }
})();
</script>
</body>
</html>
