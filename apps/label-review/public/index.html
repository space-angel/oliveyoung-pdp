<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리뷰 질문 검수</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg:#0C0C0E; --fg:#FBFBFB; --fg2:#BDBDBD; --fg70:rgba(255,255,255,.7); --fg50:rgba(255,255,255,.5); --fg30:rgba(255,255,255,.3); --grey:#8C8C8C;
    --card:rgba(255,255,255,.04); --card2:rgba(255,255,255,.08); --card3:rgba(255,255,255,.12); --line:rgba(255,255,255,.08);
    --blue:#478BFF; --blue80:rgba(71,139,255,.8); --blue-bg:rgba(71,139,255,.15);
    --mint:#54ED91; --mint70:rgba(75,236,139,.7); --mint-bg:rgba(70,236,136,.13); --lime:#DDF34F; --lime-bg:rgba(221,244,87,.10);
    --coral:#FF7A6B; --coral-bg:rgba(255,122,107,.14);
    --r:24px; --pill:100px;
  }
  * { box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; scroll-behavior:smooth; }
  body { margin:0; background-color:var(--bg); background-image:radial-gradient(900px 520px at 18% -10%, rgba(71,139,255,.22), transparent 70%), radial-gradient(700px 500px at 100% 40%, rgba(255,255,255,.05), transparent 70%); background-repeat:no-repeat; background-attachment:fixed; color:var(--fg); font:18px/1.6 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; letter-spacing:-0.5px; }
  button { font:inherit; letter-spacing:inherit; cursor:pointer; color:inherit; }
  header { position:sticky; top:16px; z-index:3; margin:16px auto 0; width:min(1100px, calc(100% - 32px)); height:64px; border-radius:var(--pill); background:rgba(0,0,0,.5); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); display:flex; align-items:center; gap:14px; padding:0 12px 0 28px; }
  header .left { display:flex; align-items:center; gap:14px; min-width:0; flex:1; }
  header .name { font-size:20px; font-weight:700; letter-spacing:0; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* 판정 화면에서 질문 제목이 화면 밖으로 나가면 헤더가 제품명 대신 질문·답을 보여준다 — 스크롤 중에도 봐야 하는 정보 */
  header.ctx .left { align-items:baseline; gap:12px; animation:hin .25s ease; }
  header.ctx .left::before { content:'Q'; flex:none; align-self:center; width:26px; height:26px; border-radius:8px; background:var(--blue-bg); color:var(--blue); font-size:13px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }
  header.ctx .name { font-size:18px; letter-spacing:-.5px; line-height:1.3; color:var(--fg); flex:none; max-width:56%; }
  header.ctx .tag { border:0; padding:0; font-size:15px; color:var(--fg50); letter-spacing:-.3px; flex:1; min-width:0; }
  @keyframes hin { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  header .tag { font-size:18px; color:var(--fg2); font-weight:400; border-left:1px solid var(--line); padding-left:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .right { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .navpill { height:40px; padding:0 18px; border-radius:var(--pill); background:var(--card2); display:flex; align-items:center; gap:10px; font-size:18px; font-weight:400; color:var(--fg2); }
  .navpill b { font-variant-numeric:tabular-nums; font-weight:600; }
  .navpill.white { background:#FBFBFB; color:#0C0C0E; font-weight:600; }
  .bar { width:80px; height:4px; border-radius:2px; background:var(--card3); overflow:hidden; } .bar i { display:block; height:100%; background:var(--blue); }
  main { width:min(1100px, calc(100% - 32px)); margin:0 auto; padding:104px 0 160px; display:flex; flex-direction:column; gap:56px; }
  .fade { animation: fade .3s ease; } @keyframes fade { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }
  /* 트랙 헤더 문법: 작은 알약 → 큰 제목 → 색 부제 */
  .track { display:flex; flex-direction:column; gap:22px; padding:0 8px; }
  .track .pill { align-self:flex-start; } .track .pills { margin-bottom:-6px; } .track .msg { margin-top:6px; max-width:720px; }
  h1.display { margin:0; font-size:clamp(34px, 4.4vw, 56px); line-height:1.3; font-weight:600; letter-spacing:-1.5px; color:var(--blue); text-wrap:pretty; }
  h1.display.mint { color:var(--mint); } h1.display.white { color:var(--fg); }
  .sub { margin:0; font-size:20px; line-height:1.5; letter-spacing:-0.5px; color:var(--blue80); font-weight:500; text-wrap:pretty; }
  .sub.white { color:var(--fg2); font-weight:400; }
  .pill { display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 16px; border-radius:var(--pill); font-size:17px; font-weight:500; letter-spacing:-0.5px; background:var(--card2); color:var(--fg70); white-space:nowrap; line-height:1.6; }
  .pill.blue { background:var(--blue-bg); color:var(--blue); font-weight:700; letter-spacing:0; } .pill.mint, .pill.coral, .pill.lime { background:var(--card2); color:var(--fg); } .pill.mint::before, .pill.coral::before { content:''; width:8px; height:8px; border-radius:50%; } .pill.mint::before { background:var(--mint); } .pill.coral::before { background:var(--coral); }
  .pills { display:flex; flex-wrap:wrap; gap:10px; }
  .eyebrow { font-size:17px; color:var(--grey); padding:0 8px; letter-spacing:-1px; font-weight:600; margin-bottom:-32px; }
  /* 세션 카드 문법: 큰 문장 · 태그 · 하단 색 라벨 + 〉 */
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:24px; }
  .card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:var(--r); padding:36px 32px 32px; display:flex; flex-direction:column; gap:24px; min-height:300px; position:relative; overflow:hidden; isolation:isolate; }
  .card > * { position:relative; z-index:1; }
  /* 색 글자 뒤 글로우 — 카드 왼쪽 위(인용)와 왼쪽 아래(라벨) */
  .card .big { margin:0; font-size:28px; line-height:1.4; font-weight:600; letter-spacing:-1px; color:var(--fg); text-wrap:pretty; }
  .card .ctx { color:var(--fg50); font-weight:400; font-size:19px; }
  .card .ctx { display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .card .ctxp { margin:-6px 0 0; font-size:15px; line-height:1.65; color:var(--fg50); letter-spacing:-0.5px; }
  .card .ctxp.full { white-space:pre-line; display:none; } .card .ctx.open .ctxp.full { display:block; } .card .ctx.open .ctxp.short { display:none; }
  .card .more { background:none; border:0; padding:0; color:var(--blue); font-size:14px; font-weight:600; cursor:pointer; letter-spacing:-.3px; font-family:inherit; } .card .more .m2 { display:none; } .card .ctx.open .more .m1 { display:none; } .card .ctx.open .more .m2 { display:inline; } .card .ctxp .lbl { display:block; font-size:12px; font-weight:600; color:var(--grey); letter-spacing:0; margin-bottom:6px; text-transform:none; } .card .ctxp b { color:var(--fg70); font-weight:600; }
  .card .tags { display:flex; flex-wrap:wrap; gap:8px; }
  .tagc { height:30px; padding:0 10px; border-radius:8px; background:rgba(255,255,255,.04); box-shadow:inset 0 0 0 1px rgba(255,255,255,.04); color:var(--fg50); font-size:15px; font-weight:500; line-height:1.4; display:inline-flex; align-items:center; }
  .card .foot { margin-top:auto; padding-top:8px; display:flex; align-items:center; justify-content:space-between; font-size:18px; font-weight:600; letter-spacing:-0.5px; }
  .card .foot .who { position:relative; }
  .card .foot .who.positive::after, .card .foot .who.negative::after { content:''; position:absolute; z-index:-1; pointer-events:none; left:-56px; right:-36px; top:-44px; bottom:-72px; border-radius:50%; filter:blur(26px); }
  .card .foot .who.positive::after { background:rgba(84,237,145,.11); } .card .foot .who.negative::after { background:rgba(255,122,107,.11); }
  .card .foot .who.positive { color:var(--mint); } .card .foot .who.negative { color:var(--coral); } .card .foot .who.neutral { color:var(--fg50); }
  .card .foot .chev { color:var(--fg30); font-size:20px; }
  .card .foot .who::before { content:''; display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background:currentColor; vertical-align:middle; }
  .card mark { background:transparent; color:inherit; }
  .card .tools { display:none; gap:8px; } .editing .card .tools { display:flex; }
  .card.wide { min-height:0; gap:22px; }
  /* 놓친 근거 */
  .missed { border-radius:var(--r); background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); backdrop-filter:blur(20px); overflow:hidden; }
  .missed summary { list-style:none; cursor:pointer; padding:18px 28px; display:flex; align-items:center; gap:12px; font-size:18px; color:var(--blue); font-weight:500; letter-spacing:-0.5px; }
  .missed summary::-webkit-details-marker { display:none; } .missed summary b { font-weight:700; }
  .missed .body { display:flex; flex-direction:column; gap:10px; padding:0 12px 12px; }
  .missed .hint { display:flex; gap:14px; align-items:flex-start; margin:0 4px 6px; padding:16px 18px; border-radius:16px; background:var(--blue-bg); letter-spacing:-.3px; }
  .missed .hint .ico { flex:none; width:28px; height:28px; border-radius:50%; background:var(--blue); color:#fff; font-size:14px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; margin-top:1px; }
  .missed .hint b { display:block; font-size:16px; font-weight:700; color:var(--fg); line-height:1.4; margin-bottom:3px; }
  .missed .hint span:not(.ico) { display:block; font-size:14px; line-height:1.5; color:var(--fg2); }
  .missed .sent .sm { opacity:.55; transition:opacity .15s; } .missed .sent:hover .sm, .missed .sent .sm[class*="on-"] { opacity:1; }
  .mr { background:rgba(255,255,255,.03); border-radius:16px; padding:16px 18px; display:flex; flex-direction:column; gap:8px; }
  .mr .m { font-size:14px; color:var(--fg50); display:flex; gap:10px; }
  .sent { display:flex; gap:8px; align-items:center; background:var(--card); border-radius:12px; padding:10px 12px; font-size:16px; color:var(--fg70); }
  .sent span { flex:1; }
  /* 버튼: 알약 */
  .btn { height:64px; padding:0 32px; border-radius:var(--pill); border:0; background:var(--card2); color:var(--fg); font-weight:600; font-size:18px; letter-spacing:-0.5px; display:flex; align-items:center; justify-content:center; gap:10px; transition:background .15s, transform .1s; } .btn:active { transform:scale(.98); }
  .btn small { font-size:15px; font-weight:400; color:var(--fg50); }
  .btn:hover { background:var(--card3); }
  .btn.white { background:#FBFBFB; color:#0C0C0E; } .btn.white small { color:rgba(12,12,14,.55); } .btn.white:hover { background:#fff; }
  .btn.blue { background:var(--blue); color:#fff; } .btn.blue small { color:rgba(255,255,255,.75); } .btn.blue:hover { background:#5C98FF; }
  .btn.coral { color:var(--coral); }
  .btn.ghost { background:transparent; color:var(--fg50); } .btn.ghost:hover { background:var(--card); }
  .btn:disabled { opacity:.35; cursor:default; }
  .sm { height:34px; padding:0 12px; border-radius:var(--pill); border:0; background:var(--card2); color:var(--fg70); font-size:15px; font-weight:500; letter-spacing:-0.5px; }
  .sm:hover { background:var(--card3); }
  .sm.on-good { background:var(--card3); color:var(--mint); } .sm.on-bad { background:var(--card3); color:var(--coral); } .sm.on-neu { background:var(--card3); color:var(--fg); }
  .actions { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; padding-top:8px; }
  .dock { position:sticky; bottom:0; z-index:2; margin:-24px -16px -160px; padding:44px 16px 28px; display:flex; flex-direction:column; gap:16px; align-items:center; background:linear-gradient(to top, rgba(12,12,14,.97) 0, rgba(12,12,14,.97) calc(100% - 40px), rgba(12,12,14,0)); }
  .dock .actions { padding-top:0; }
  .verdict { display:inline-flex; align-items:center; gap:10px; height:44px; padding:0 20px; border-radius:100px; background:var(--card2); font-size:16px; font-weight:600; color:var(--fg); letter-spacing:-.3px; }
  .verdict .dot { width:8px; height:8px; border-radius:50%; background:var(--fg50); } .verdict.accept .dot, .verdict.edit .dot { background:var(--mint); } .verdict.reject .dot { background:var(--coral); }
  .criteria { display:flex; gap:10px 28px; flex-wrap:wrap; justify-content:center; font-size:15px; color:var(--fg2); letter-spacing:-.3px; }
  .criteria b { display:inline-flex; width:20px; height:20px; border-radius:50%; align-items:center; justify-content:center; background:rgba(255,255,255,.08); font-size:12px; margin-right:6px; vertical-align:middle; }
  .actions .btn { min-width:220px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; } .row > .btn { flex:1; }
  /* 입력 */
  .field { display:flex; flex-direction:column; gap:10px; }
  .field label { font-size:15px; color:var(--fg50); font-weight:500; }
  input, textarea { width:100%; font:inherit; letter-spacing:inherit; color:var(--fg); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:16px 18px; outline:none; }
  input:focus, textarea:focus { border-color:var(--blue); background:var(--card3); }
  textarea { min-height:72px; resize:vertical; line-height:1.5; }
  textarea.big { font-size:24px; font-weight:600; letter-spacing:-0.03em; line-height:1.35; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { height:40px; padding:0 18px; border-radius:var(--pill); border:0; background:var(--card2); color:var(--fg2); font-size:17px; letter-spacing:-0.5px; }
  .chip b { color:var(--fg50); font-weight:500; margin-left:6px; } .chip.on { background:#FBFBFB; color:#0C0C0E; } .chip.on b { color:#666; }
  .opt { display:flex; align-items:center; gap:18px; padding:26px 28px; border-radius:20px; border:1px solid rgba(255,255,255,.07); background:rgba(255,255,255,.04); backdrop-filter:blur(20px); text-align:left; width:100%; }
  .opt:hover { background:var(--card2); } .opt.on { border-color:var(--coral); } .opt.on .dot { background:var(--coral); border-color:var(--coral); }
  .opt .dot { width:24px; height:24px; border-radius:50%; border:2px solid var(--fg30); flex:none; display:flex; align-items:center; justify-content:center; }
  .opt b { display:block; font-size:20px; font-weight:600; letter-spacing:-0.5px; line-height:1.4; } .opt small { color:var(--fg50); font-size:15px; line-height:1.5; }
  .msg { padding:14px 18px; border-radius:16px; font-size:15px; font-weight:500; background:rgba(255,255,255,.06); color:var(--fg2); border:1px solid rgba(255,255,255,.07); } .msg.err { color:var(--coral); } .msg.ok { color:var(--mint); } .msg.warn { color:var(--fg2); }
  .note { font-size:15px; color:var(--grey); line-height:1.6; }
  .stats { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; }
  .stat { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); backdrop-filter:blur(20px); border-radius:20px; padding:22px 12px; text-align:center; } .stat b { display:block; font-size:47px; font-weight:600; letter-spacing:-2px; font-variant-numeric:tabular-nums; line-height:1.2; } .stat span { font-size:15px; color:var(--fg50); }
  .stat.hi b { color:var(--mint); }
  .center { display:flex; flex-direction:column; align-items:center; text-align:center; gap:28px; }
  .narrow { width:min(640px, 100%); margin:0 auto; }
  .hero { padding:24px 8px 8px; display:flex; flex-direction:column; gap:20px; }
  /* 부가 설명 레이어: 본문에 문단으로 끼우지 않고 ⓘ 뒤로 보낸다 */
  .help { width:22px; height:22px; border-radius:50%; border:1px solid rgba(255,255,255,.18); background:transparent; color:var(--fg50); font-size:13px; font-weight:700; line-height:1; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex:none; font-family:inherit; vertical-align:middle; transition:background .15s, color .15s; }
  .help:hover, .help.on { background:rgba(255,255,255,.12); color:var(--fg); }
  .tip { position:fixed; z-index:20; width:min(360px, calc(100vw - 32px)); padding:18px 20px; border-radius:20px; background:#1B1B1F; border:1px solid rgba(255,255,255,.1); box-shadow:0 20px 60px rgba(0,0,0,.5); color:var(--fg2); font-size:15px; line-height:1.6; letter-spacing:-.3px; }
  .tip b { color:var(--fg); font-weight:600; } .tip .t { display:block; font-size:16px; font-weight:700; color:var(--fg); margin-bottom:8px; }
  .tip ul { margin:8px 0 0; padding-left:18px; } .tip li { margin:4px 0; }
  @media (max-width:640px) { .tip { left:0 !important; right:0; top:auto !important; bottom:0; width:auto; border-radius:24px 24px 0 0; padding:24px 24px 36px; } }
  .tipbg { position:fixed; inset:0; z-index:19; }
  /* 마지막 한 가지: 리뷰 전체를 글로 읽는 상자. 문장을 누르면 선택창 */
  .rbox { display:flex; flex-direction:column; gap:10px; }
  /* 마지막 한 가지 도크: 고른 근거 + 버튼. '질문 적기'를 누르면 도크 안에서 폼이 펼쳐진다 */
  .hdock { position:sticky; bottom:0; z-index:2; margin:-24px -16px -160px; padding:44px 16px 24px; display:flex; flex-direction:column; gap:14px; align-items:stretch; background:linear-gradient(to top, rgba(12,12,14,.97) 0, rgba(12,12,14,.97) calc(100% - 40px), rgba(12,12,14,0)); }
  .hdock .hbar { display:flex; align-items:center; gap:14px; width:min(1100px, 100%); margin:0 auto; }
  .hdock .evs { flex:1; min-width:0; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px 0; } .hdock .evs::-webkit-scrollbar { display:none; }
  .hdock .evs .pill { flex:none; height:36px; font-size:15px; } .hdock .evs .note { align-self:center; white-space:nowrap; }
  .hdock .acts { display:flex; gap:10px; flex:none; } .hdock .acts .btn { height:52px; padding:0 22px; min-width:0; }
  .hdock .form { width:min(1100px, 100%); margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:18px 20px 20px; border-radius:20px; background:#17171B; border:1px solid rgba(255,255,255,.1); box-shadow:0 -20px 60px rgba(0,0,0,.45); }
  .hdock .form .field textarea { min-height:72px; } .hdock .form .field textarea.big { min-height:72px; font-size:20px; }
  .hdock .form .row { grid-column:1 / -1; justify-content:flex-end; gap:10px; }
  @media (max-width:760px) { .hdock .form { grid-template-columns:1fr; } .hdock .hbar { flex-wrap:wrap; } }
  .rbox-hint { display:flex; gap:14px; align-items:flex-start; padding:16px 18px; border-radius:16px; background:var(--blue-bg); letter-spacing:-.3px; margin-bottom:4px; }
  .rbox-hint .ico { flex:none; width:28px; height:28px; border-radius:50%; background:var(--blue); color:#fff; font-size:14px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; margin-top:1px; }
  .rbox-hint b { display:block; font-size:16px; font-weight:700; color:var(--fg); line-height:1.4; margin-bottom:3px; } .rbox-hint span:not(.ico) { display:block; font-size:14px; line-height:1.5; color:var(--fg2); }
  .rv { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); border-radius:20px; padding:16px 20px 18px; display:flex; flex-direction:column; gap:10px; }
  .rv.used { border-color:rgba(84,237,145,.35); }
  .rv .m { display:flex; gap:12px; font-size:13px; color:var(--grey); }
  .rv p { margin:0; font-size:16px; line-height:1.75; color:var(--fg2); letter-spacing:-.3px; }
  .sq { cursor:pointer; border-radius:6px; padding:1px 2px; transition:background .15s, color .15s; } .sq:hover { background:rgba(255,255,255,.08); color:var(--fg); }
  .sq.hit { color:var(--fg); }
  .sq.on-positive { background:rgba(84,237,145,.16); color:var(--mint); } .sq.on-negative { background:rgba(255,122,107,.16); color:var(--coral); } .sq.on-neutral { background:rgba(255,255,255,.14); color:var(--fg); }
  .tip.pick { width:auto; max-width:min(520px, calc(100vw - 32px)); } .tip.pick .pick-q { font-size:14px; color:var(--fg50); margin-bottom:10px; max-height:60px; overflow:hidden; } .tip.pick .pills { gap:6px; }
  /* 30초 안내: 실제 요소 위 스포트라이트(box-shadow 로 주변을 어둡게) + 코치마크 */
  .spot { position:fixed; z-index:30; border-radius:22px; box-shadow:0 0 0 9999px rgba(0,0,0,.72), 0 0 0 2px rgba(71,139,255,.55); pointer-events:none; transition:left .35s ease, top .35s ease, width .35s ease, height .35s ease; }
  .coach { position:fixed; z-index:31; width:min(400px, calc(100vw - 32px)); padding:22px 24px 20px; border-radius:22px; background:#17171B; border:1px solid rgba(255,255,255,.1); box-shadow:0 24px 70px rgba(0,0,0,.6); transition:left .35s ease, top .35s ease; }
  .coach .k { font-size:13px; font-weight:700; color:var(--blue); letter-spacing:0; margin-bottom:8px; }
  .coach .t { font-size:20px; font-weight:700; color:var(--fg); letter-spacing:-.5px; line-height:1.3; margin-bottom:8px; }
  .coach .b { font-size:15px; line-height:1.6; color:var(--fg2); letter-spacing:-.3px; } .coach .b b { color:var(--fg); font-weight:700; }
  .coach .acts { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:18px; } .coach .acts .btn { height:48px; padding:0 22px; min-width:0; } .coach .acts .btn:disabled { opacity:.45; cursor:default; }
  header .navpill.guide { border:1px solid rgba(255,255,255,.14); background:transparent; color:var(--fg2); cursor:pointer; font-family:inherit; font-size:16px; gap:8px; padding:0 16px 0 10px; transition:background .15s; }
  header .navpill.guide:hover { background:var(--card2); } header .navpill.guide .q { width:22px; height:22px; border-radius:50%; background:var(--blue-bg); color:var(--blue); font-size:13px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <div class="left"><span class="name" id="hName">리뷰 질문 검수</span><span class="tag" id="hTag" hidden></span></div>
  <div class="right" id="hRight"></div>
</header>
<main id="main"></main>
<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 원문에 HTML 엔티티(&lt;색깔&gt;)가 그대로 들어 있다. 보여줄 때만 풀고, 저장되는 인용은 원문 그대로 둔다 (계약: 원문 부분문자열).
const txt = s => esc(String(s ?? '').replace(/&(lt|gt|amp|quot|#39|nbsp);/g, m => ({'&lt;':'<','&gt;':'>','&amp;':'&','&quot;':'"','&#39;':"'",'&nbsp;':' '}[m])));
const stars = n => '★'.repeat(n) + '☆'.repeat(5-n);
const S = { me:null, view:null, idx:0, screen:'start', editing:false, draft:null, reason:null, startedAt:Date.now(), human:null };
const STANCE = { positive:'긍정', negative:'부정', neutral:'중립' };
const NEXT = { positive:'negative', negative:'neutral', neutral:'positive' };

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : undefined);
  const j = await r.json().catch(()=>({error:'서버 응답을 읽을 수 없어요'}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const minutes = () => Math.max(0.5, Math.round((Date.now()-S.startedAt)/60000*2)/2);

// ---------- 시작 ----------
function renderStart(err) {
  setHeader(null);
  $('#main').innerHTML = `
  <div class="track fade"><span class="pill blue">리뷰 질문 검수</span><h1 class="display white">리뷰가 답해주는 질문을<br>함께 골라요</h1><p class="sub">한 화면에 결정은 하나, 저장은 자동이에요</p></div>
  <div class="grid fade" style="align-items:start">
    <div class="card wide" style="gap:20px">
      <div class="field"><label>이름 또는 닉네임</label><input id="name" placeholder="예: 호윤" autocomplete="off"></div>
      <div class="field"><label>접속 코드 <span style="color:var(--fg30)">(안내받은 게 있으면)</span></label><input id="code" placeholder="없으면 비워두세요" autocomplete="off"></div>
      ${err ? `<div class="msg err">${esc(err)}</div>` : ''}
      <button class="btn white" id="go">시작 〉</button>
      <div class="note">이름은 누가 어떤 판단을 했는지 기록하는 데만 써요. 다른 참여자에게는 보이지 않아요.</div>
    </div>
    <div class="card wide">
      <p class="big">리뷰가 정말 그렇게 말하는지<br>확인하는 일이에요</p><p class="sub white" style="font-size:17px">제품마다 "구매자가 물을 질문 + 리뷰가 주는 답" 후보가 있어요. 굵게 칠한 리뷰 문장이 그 답을 뒷받침하면 <b>맞아요</b>, 조금 다르면 <b>고칠게요</b>, 아니면 <b>아니에요</b>.</p>
      <div class="tags"><span class="tagc">근거는 굵은 문장</span><span class="tagc">한 번에 결정 하나</span><span class="tagc">중간에 닫아도 이어져요</span></div>
      <div class="foot"><span style="color:var(--blue)">시작하면 첫 화면에서 30초 안내가 같이 진행돼요</span></div>
    </div>
  </div>`;
  const saved = JSON.parse(localStorage.getItem('labeler') || 'null');
  if (saved) $('#name').value = saved.name;
  $('#go').onclick = async () => {
    try {
      S.me = await api('/api/start', {name: $('#name').value, code: $('#code').value});
      localStorage.setItem('labeler', JSON.stringify(S.me));
      await load();
    } catch (e) { renderStart(e.message); }
  };
}

// ---------- 번들 로드 ----------
async function load(keepId) {
  S.view = await api(`/api/bundle?labeler=${encodeURIComponent(S.me.labelerId)}&name=${encodeURIComponent(S.me.name)}`);
  if (!S.view.assignment) { renderNoWork(); return; }
  const undecided = S.view.candidates.findIndex(c => !c.decision);
  const keep = keepId ? S.view.candidates.findIndex(c => c.candidateId === keepId) : -1;
  S.editing = false; S.draft = null; S.reason = null; S.startedAt = Date.now();
  if (keep >= 0) { S.idx = keep; S.screen = 'judge'; }           // 방금 판단한 카드에 머무른다 — 저장 결과를 보고 "다음"을 직접 누른다
  else if (undecided < 0) { S.idx = 0; S.screen = S.view.noMissed || S.view.labels.some(l=>l.source==='human') ? 'done' : 'missed'; }
  else { S.idx = undecided; S.screen = 'judge'; }
  render();
  let seen = false; try { seen = !!localStorage.getItem('tourDone'); } catch (e) {}
  if (S.screen === 'judge' && !S.view.candidates[S.idx].decision && !seen) setTimeout(startTour, 350);
}
function afterCandidates() { S.screen = S.view.noMissed || S.view.labels.some(l=>l.source==='human') ? 'done' : 'missed'; render(); }
function goNext() {
  const n = S.view.candidates.length;
  if (S.idx + 1 < n) { S.idx += 1; S.editing = false; S.draft = null; S.startedAt = Date.now(); renderJudge(); window.scrollTo(0,0); }
  else afterCandidates();
}
function goPrev() { if (S.idx > 0) { S.idx -= 1; S.editing = false; S.draft = null; renderJudge(); window.scrollTo(0,0); } }
function setHeader(v) {
  const c = v?.candidates || [];
  const done = c.filter(x=>x.decision).length;
  document.querySelector('header').classList.remove('ctx');
  $('#hName').textContent = v ? v.bundle.displayName : '리뷰 질문 검수';
  $('#hTag').hidden = !v; if (v) $('#hTag').textContent = `${v.bundle.category} · 리뷰 ${v.bundle.reviewCount}개`;
  $('#hRight').innerHTML = v ? `<span class="navpill"><b>${done} / ${c.length}</b> 봤어요 <span class="bar"><i style="width:${c.length?Math.round(100*done/c.length):0}%"></i></span></span><button type="button" class="navpill guide" id="guideBtn"><span class="q">?</span>안내</button><span class="navpill white">${esc(S.me.name)}</span>` : (S.me ? `<span class="navpill white">${esc(S.me.name)}</span>` : '');
  $('#guideBtn')?.addEventListener('click', () => { if (S.screen === 'judge') startTour(); else alert_(); });
}
function headerContext(on, c) {
  const h = document.querySelector('header');
  h.classList.toggle('ctx', on);
  if (on) { $('#hName').textContent = c.question; $('#hTag').hidden = false; $('#hTag').textContent = c.answer; }
  else setHeader(S.view);
}
function watchHero(c) {
  S.obs?.disconnect();
  const hero = $('#cand'); if (!hero) return;
  S.obs = new IntersectionObserver(([e]) => headerContext(!e.isIntersecting && e.boundingClientRect.top < 0, c), { rootMargin:'-96px 0px 0px 0px', threshold:0 });
  S.obs.observe(hero);
}
function render() {
  endTour(false);
  S.obs?.disconnect(); S.obs = null;
  setHeader(S.view);
  ({judge: renderJudge, reject: renderReject, missed: renderMissed, done: renderDone})[S.screen]();
}
function renderNoWork() {
  setHeader(null);
  $('#main').innerHTML = `<div class="track fade"><h1 class="display white">지금은 볼 제품이 없어요</h1><p class="sub white">모든 제품이 배정됐어요. 고마워요, ${esc(S.me.name)}.</p></div>`;
}

// ---------- 판정 ----------
function quoteHtml(q, i) {
  const who = STANCE[q.stance];
  return `<div class="card ${q.stance}" data-i="${i}">
    <p class="big"><mark>${txt(q.quote)}</mark></p>
    ${(q.before||q.after) ? `<div class="ctx"><p class="ctxp short">${q.before.length>90?'…':''}${txt(q.before.slice(-90).trim())}<b>${txt(q.quote)}</b>${txt(q.after.slice(0,90).trim())}${q.after.length>90?'…':''}</p><p class="ctxp full"><span class="lbl">리뷰 전문</span>${txt(q.before)}<b>${txt(q.quote)}</b>${txt(q.after)}</p>${(q.before.length>90||q.after.length>90) ? `<button type="button" class="more" data-more><span class="m1">전문 보기 ⌵</span><span class="m2">접기 ⌃</span></button>` : ''}</div>` : ''}
    <div class="tags"><span class="tagc">${stars(q.rating)}</span><span class="tagc">${esc(q.conditionLine.split(' · ')[0])}</span>${q.added?'<span class="tagc" style="color:var(--blue)">놓친 리뷰에서 넣음</span>':''}</div>
    <div class="tools"><button type="button" class="sm on-${q.stance==='positive'?'good':q.stance==='negative'?'bad':'neu'}" data-cycle="${i}">입장 바꾸기 ⇄</button><button type="button" class="sm" data-rm="${i}">근거에서 빼기</button></div>
    <div class="foot"><span class="who ${q.stance}">${who}</span></div>
  </div>`;
}
function missedHtml(list, mode) {
  if (!list.length) return '';
  return `<details class="missed"><summary>같은 얘기를 하는 리뷰가 <b>${list.length}개</b> 더 있어요<small style="color:var(--fg50);font-weight:400;margin-left:10px">근거를 놓쳤는지만 봐요</small>${help('missed')}<span style="margin-left:auto">보기 〉</span></summary>
    <div class="body">${mode==='locked' ? '' : `<div class="hint"><span class="ico">✓</span><div><b>전부 고르는 게 아니에요</b><span>이 답을 뒷받침하는 문장이 있을 때만 그 옆에서 긍정·부정·중립 하나를 눌러요. 나머지는 그냥 두면 돼요.</span></div></div>`}${list.map(r => `<div class="mr"><div class="m"><span>${stars(r.rating)}</span><span>${esc(r.conditionLine.split(' · ')[0])}</span><span>· ${esc(r.hits.join(' '))}</span></div>
      ${r.sentences.map(s => `<div class="sent"><span>${txt(s)}</span>${mode==='locked' ? '' : `
        <button type="button" class="sm" data-add='${esc(JSON.stringify({reviewId:r.reviewId, quote:s, stance:'positive'}))}'>긍정</button>
        <button type="button" class="sm" data-add='${esc(JSON.stringify({reviewId:r.reviewId, quote:s, stance:'negative'}))}'>부정</button>
        <button type="button" class="sm" data-add='${esc(JSON.stringify({reviewId:r.reviewId, quote:s, stance:'neutral'}))}'>중립</button>`}</div>`).join('')}</div>`).join('')}
    ${mode==='locked' ? '' : `<div class="note" style="padding:0 8px 8px">${mode==='judge' ? '누르면 "고칠게요"로 바뀌고 근거에 들어가요.' : '누르면 근거에 들어가요.'}</div>`}</div></details>`;
}
function verdictText(d) {
  if (d.kind === 'accept') return '맞아요 — 그대로 저장했어요';
  if (d.kind === 'edit') return '고칠게요 — 고친 대로 저장했어요';
  const r = S.view.reasons.find(x => x.key === d.reason);
  return `아니에요 — ${r ? r.title : '이유 선택'}${d.contractError ? ' · 기각 기록만 남김' : ''}`;
}
function renderJudge(msg) {
  const c = S.view.candidates[S.idx];
  const decided = c.decision || null;
  if (decided) S.editing = false;
  const d = S.draft || { question:c.question, answer:c.answer, aspect:c.aspect, evidence: c.quotes.map(q=>({reviewId:q.reviewId, stance:q.stance, quote:q.quote})) };
  const quotes = S.editing ? d.evidence.map(e => {
    const q = c.quotes.find(x=>x.reviewId===e.reviewId && x.quote===e.quote);
    if (q) return {...q, ...e};
    // 놓친 리뷰에서 새로 넣은 근거 — 후보 인용이 아니라 메타가 없으니 번들 리뷰에서 채운다 (별점·조건·앞뒤 원문)
    const r = S.view.reviews.find(x=>x.reviewId===e.reviewId) || {content:'', rating:0, conditionLine:''};
    const i = r.content.indexOf(e.quote);
    return {rating:r.rating, conditionLine:r.conditionLine, before: i>=0 ? r.content.slice(0,i) : '', after: i>=0 ? r.content.slice(i+e.quote.length) : '', added:true, ...e};
  }) : c.quotes;
  const warn = [...(c.contractErrors.length ? ['이 후보의 인용이 원문과 달라요. 그대로는 저장할 수 없어요 — 고쳐서 저장하거나 "아니에요"를 눌러주세요.'] : []),
                ...(c.stanceMigrated ? ['긍정/부정 표시는 자동으로 붙인 값이에요. 문장을 읽고 다르면 고쳐주세요.'] : []),
                ...c.checks.filter(x=>x.level==='warn').map(x=>x.text)];
  $('#main').innerHTML = `
  <div class="track fade ${S.editing?'editing':''}" id="cand">
    <div class="pills"><span class="pill blue">질문 후보 ${S.idx+1} / ${S.view.candidates.length}</span><span class="pill">${esc(c.aspect || '주제 없음')}</span></div>
    ${S.editing ? `<div class="field"><label>질문</label><textarea class="big" id="eq">${esc(d.question)}</textarea></div><div class="field"><label>답 — 리뷰가 말하는 것</label><textarea id="ea">${esc(d.answer)}</textarea></div>`
                : `<h1 class="display">${esc(c.question)}</h1><p class="sub">${esc(c.answer)}</p>`}
    <div class="pills" id="counts"></div>
    ${warn.length ? `<div class="msg warn">${warn.map(esc).join('<br>')}</div>` : ''}
  </div>
  <div class="eyebrow">이 질문을 만든 리뷰 ${quotes.length}개 · 굵은 문장이 근거예요</div>
  <div class="grid ${S.editing?'editing':''}" id="quotes">${quotes.map(quoteHtml).join('')}</div>
  ${missedHtml(c.missed, decided ? 'locked' : 'judge')}
  ${msg ? `<div class="msg ${msg.cls}">${esc(msg.text)}</div>` : ''}
  ${decided
    ? `<div class="dock"><div class="verdict ${decided.kind}"><span class="dot"></span><span>${verdictText(decided)}</span></div>
       <div class="actions"><button class="btn ghost" id="prev" ${S.idx>0?'':'disabled'}>〈 이전</button><button class="btn white" id="next">${S.idx+1 < S.view.candidates.length ? `다음 질문 〉 <small>${S.idx+2} / ${S.view.candidates.length}</small>` : `후보 끝 · 놓친 질문으로 〉`}</button></div></div>`
    : S.editing
    ? `<div class="actions"><button class="btn ghost" id="cancelEdit">그대로 두기</button><button class="btn white" id="saveEdit">고친 대로 저장 〉</button></div>`
    : `<div class="dock"><div class="criteria"><span><b>1</b> 굵은 문장이 이 답을 실제로 말하나요?</span><span><b>2</b> 한 명의 특수한 사정이 아니라, 다른 구매자도 겪을 얘기인가요?</span><span><b>3</b> 사기 전에 물어볼 만한 질문인가요?</span>${help('criteria')}</div>
       <div class="actions">${S.idx>0?'<button class="btn ghost" id="prev">〈 이전</button>':''}<button class="btn white" id="accept">맞아요 <small>셋 다 그래요</small></button><button class="btn" id="edit">고칠게요 <small>문장·근거 수정</small></button><button class="btn coral" id="reject">아니에요 <small>이유 하나 선택</small></button></div></div>`}`;
  renderCounts(quotes);
  watchHero(c);
  if (S.editing) S.draft = d;
  $('#accept')?.addEventListener('click', () => decide({kind:'accept'}));
  $('#next')?.addEventListener('click', goNext);
  $('#prev')?.addEventListener('click', goPrev);
  $('#reject')?.addEventListener('click', () => { S.screen='reject'; S.reason=null; render(); });
  $('#edit')?.addEventListener('click', () => { S.editing = true; S.draft = d; renderJudge(); });
  $('#cancelEdit')?.addEventListener('click', () => { S.editing=false; S.draft=null; renderJudge(); });
  $('#saveEdit')?.addEventListener('click', () => {
    S.draft.question = $('#eq').value; S.draft.answer = $('#ea').value;
    decide({kind:'edit', edits:{question:S.draft.question, answer:S.draft.answer, aspect:S.draft.aspect, evidence:S.draft.evidence}});
  });
  document.querySelectorAll('[data-cycle]').forEach(b => b.onclick = () => { syncDraft(); const e = S.draft.evidence[+b.dataset.cycle]; e.stance = NEXT[e.stance]; renderJudge(); });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { syncDraft(); S.draft.evidence.splice(+b.dataset.rm,1); renderJudge(); });
  document.querySelectorAll('[data-more]').forEach(b => b.onclick = () => b.closest('.ctx').classList.toggle('open'));
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const e = JSON.parse(b.dataset.add); if (!S.editing) { S.editing = true; S.draft = d; } else syncDraft(); S.draft.evidence = S.draft.evidence.filter(x=>x.reviewId!==e.reviewId).concat([e]); renderJudge({cls:'ok', text:'근거에 넣었어요. 저장하면 candidate_edited 로 기록돼요.'}); });
}
function syncDraft() { if (S.editing) { const q=$('#eq'), a=$('#ea'); if (q) S.draft.question=q.value; if (a) S.draft.answer=a.value; } }
function renderCounts(quotes) {
  const authors = new Map(S.view.reviews.map(r=>[r.reviewId, r.author]));
  const u = st => new Set(quotes.filter(q=>q.stance===st).map(q=>authors.get(q.reviewId))).size;
  const spoke = new Set(quotes.map(q=>authors.get(q.reviewId))).size;
  $('#counts').innerHTML = `<span class="pill coral">부정 ${u('negative')}명</span><span class="pill mint">긍정 ${u('positive')}명</span>${u('neutral')?`<span class="pill">중립 ${u('neutral')}명</span>`:''}`;
}
async function decide(extra) {
  const c = S.view.candidates[S.idx];
  try {
    const r = await api('/api/decide', {labelerId:S.me.labelerId, candidateId:c.candidateId, minutesSpent:minutes(), reason:S.reason, ...extra});
    await load(c.candidateId);
    if (r.note && S.screen==='judge') renderJudge({cls:'warn', text:r.note});
  } catch (e) { S.screen==='reject' ? renderReject(e.message) : renderJudge({cls:'err', text:e.message}); }
}

// ---------- 아니에요 ----------
function renderReject(err) {
  const c = S.view.candidates[S.idx];
  $('#main').innerHTML = `
  <div class="track fade"><div class="pills"><span class="pill" style="color:var(--coral);font-weight:700">아니에요</span><span class="pill">${esc(c.aspect||'주제 없음')}</span></div><h1 class="display white" style="color:var(--fg50);font-size:clamp(28px,3.4vw,40px)">${esc(c.question)}</h1></div>
  <div class="track fade"><h1 class="display" style="color:var(--coral)">왜 아닌가요?</h1><p class="sub white">가장 가까운 이유 하나만 골라주세요. 이 선택도 정답의 일부로 저장돼요.</p></div>
  <div class="narrow fade" style="display:flex;flex-direction:column;gap:12px">

function renderMissed(msg) {
  const v = S.view;

  const H = S.human;
  const hits = Object.entries(v.aspectHits).filter(([,h])=>h.reviews>0).sort((a,b)=>b[1].reviews-a[1].reviews);
  const terms = H.term ? v.aspectHits[H.term].keywords : [];
  // 기본은 리뷰 전체를 그대로 읽는다. 칩은 선택 사항 — 누르면 그 말이 나온 리뷰만 남기고 해당 부분을 밝게
  const shown = H.term ? v.reviews.filter(r => terms.some(t=>r.content.includes(t))) : v.reviews;

      ${shown.map(r => `<article class="rv ${used(r)?'used':''}"><div class="m"><span>${stars(r.rating)}</span><span>${esc(r.conditionLine.split(' · ')[0])}</span><span>${esc(r.month||'')}</span></div><p>${para(r)}</p></article>`).join('')}

  document.querySelectorAll('.sq').forEach(el => el.onclick = ev => {

// ---------- 30초 안내 (실제 첫 후보 화면 위에서 진행) ----------
const TOUR = [
  { sel: '#cand h1.display', title: '이게 후보 질문이에요', body: '어떤 모델이 리뷰를 읽고 "구매자가 물을 만한 질문"을 뽑았어요. 바로 아래 파란 글은 리뷰가 그 질문에 주는 답이에요. 이 둘이 리뷰에 정말 있는 말인지 확인하는 게 할 일이에요.' },
  { sel: '.grid .card:has([data-more])', title: '굵은 문장이 근거예요', body: '카드 맨 위 굵은 문장이 그 답의 근거로 뽑힌 리뷰 문장이에요. 앞뒤 맥락이 궁금하면 <b>전문 보기</b>를 눌러보세요. 한 번 눌러보면 넘어가요.', wait: { sel: '[data-more]', ev: 'click' }, skipIfMissing: true },
  { sel: '#counts', title: '몇 명이 그렇게 말했나', body: '근거 문장을 쓴 사람 수를 긍정·부정으로 나눠 세요. 리뷰 수가 아니라 <b>사람 수</b>예요. 한 사람이 여러 리뷰를 써도 1명.' },
  { sel: '.missed summary', title: '후보에 빠진 리뷰도 있어요', body: '같은 주제를 말하는데 후보 근거에는 안 들어간 리뷰예요. 근거를 놓쳤는지 볼 때 펼쳐요. 전부 고르는 게 아니라, 답을 뒷받침하는 문장만 골라요. 한 번 펼쳐보세요.', wait: { sel: '.missed', ev: 'toggle' }, skipIfMissing: true },
  { sel: '.dock .criteria', title: '판단은 이 셋으로', body: '① 굵은 문장이 이 답을 실제로 말하나 ② 한 명의 특수한 사정이 아니라 다른 구매자도 겪을 얘기인가 ③ 사기 전에 물어볼 만한 질문인가.' },
  { sel: '.dock .actions', title: '이제 직접 판단해보세요', body: '셋 다 그러면 <b>맞아요</b>, 문장이나 근거만 다르면 <b>고칠게요</b>, 하나라도 아니면 <b>아니에요</b>. 저장한 뒤엔 결과를 보고 <b>다음</b>을 직접 눌러 넘어가요. 이 안내는 오른쪽 위 <b>? 안내</b>를 누르면 다시 볼 수 있어요.', last: true },
];
let T = null;   // { i, spot, coach, cleanup }
function startTour() {
  endTour(false);
  if (!$('#cand')) return;
  const spot = document.createElement('div'); spot.className = 'spot';
  const coach = document.createElement('div'); coach.className = 'coach';
  document.body.append(spot, coach);
  T = { i: -1, spot, coach, cleanup: null };
  const onMove = () => { if (T) placeTour(); };
  window.addEventListener('scroll', onMove, { passive: true }); window.addEventListener('resize', onMove);
  T.unbind = () => { window.removeEventListener('scroll', onMove); window.removeEventListener('resize', onMove); };
  tourStep(0);
}
function tourStep(i) {
  if (!T) return;
  T.cleanup?.(); T.cleanup = null;
  while (i < TOUR.length && TOUR[i].skipIfMissing && !$(TOUR[i].sel)) i++;
  if (i >= TOUR.length) return endTour(true);
  const st = TOUR[i]; T.i = i; T.done = !st.wait;
  const el = $(st.sel); if (!el) return tourStep(i + 1);
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  T.coach.innerHTML = `<div class="k">${i + 1} / ${TOUR.length}</div><div class="t">${st.title}</div><div class="b">${st.body}</div>
    <div class="acts"><button type="button" class="sm" data-skip>건너뛰기</button><button type="button" class="btn white" data-next ${st.wait ? 'disabled' : ''}>${st.last ? '시작하기' : (st.wait ? '직접 눌러보세요' : '다음')}</button></div>`;
  T.coach.querySelector('[data-skip]').onclick = () => endTour(true);
  T.coach.querySelector('[data-next]').onclick = () => tourStep(i + 1);
  if (st.wait) {
    const target = el.closest('.card, .missed') || el;
    const h = ev => {
      if (st.wait.ev === 'click' && !ev.target.closest(st.wait.sel)) return;
      T.cleanup?.(); T.cleanup = null;
      const b = T.coach.querySelector('[data-next]'); b.disabled = false; b.textContent = '잘했어요 · 다음';
      setTimeout(() => { if (T && T.i === i) placeTour(); }, 350);
    };
    const node = st.wait.ev === 'toggle' ? $(st.wait.sel) : target;
    node.addEventListener(st.wait.ev, h);
    T.cleanup = () => node.removeEventListener(st.wait.ev, h);
  }
  setTimeout(placeTour, 250); setTimeout(placeTour, 600);
}
function placeTour() {
  if (!T) return;
  const st = TOUR[T.i]; const el = $(st.sel); if (!el) return;
  const r = el.getBoundingClientRect(), pad = 10;
  Object.assign(T.spot.style, { left: (r.left - pad) + 'px', top: (r.top - pad) + 'px', width: (r.width + pad * 2) + 'px', height: (r.height + pad * 2) + 'px' });
  // 코치마크는 스포트라이트를 가리지 않는 자리로: 아래 → 위 → 오른쪽 → 왼쪽 → 화면 오른쪽 아래
  const c = T.coach, w = c.offsetWidth, h = c.offsetHeight, W = window.innerWidth, Hh = window.innerHeight, gap = pad + 14;
  const clampX = x => Math.min(Math.max(16, x), W - w - 16), clampY = y => Math.min(Math.max(16, y), Hh - h - 16);
  let left, top;
  if (r.bottom + gap + h <= Hh - 16) { top = r.bottom + gap; left = clampX(r.left); }
  else if (r.top - gap - h >= 16) { top = r.top - gap - h; left = clampX(r.left); }
  else if (r.right + gap + w <= W - 16) { left = r.right + gap; top = clampY(r.top); }
  else if (r.left - gap - w >= 16) { left = r.left - gap - w; top = clampY(r.top); }
  else { left = W - w - 16; top = Hh - h - 16; }
  c.style.left = left + 'px'; c.style.top = top + 'px';
}
function endTour(markDone) {
  if (!T) return;
  T.cleanup?.(); T.unbind?.(); T.spot.remove(); T.coach.remove(); T = null;
  if (markDone) { try { localStorage.setItem('tourDone', '1'); } catch (e) {} }
}

}

const help = key => `<button type="button" class="help" data-help="${key}" aria-label="설명">?</button>`;
function closeTip() { document.querySelectorAll('.tip, .tipbg').forEach(e => e.remove()); document.querySelectorAll('.help.on').forEach(e => e.classList.remove('on')); }
document.addEventListener('click', ev => {

  document.body.append(bg, tip);
  const r = b.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let left = Math.min(Math.max(16, r.left + r.width / 2 - w / 2), window.innerWidth - w - 16);
  let top = r.bottom + 10; if (top + h > window.innerHeight - 16) top = r.top - h - 10;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}, true);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeTip(); });

(async () => {
  const saved = JSON.parse(localStorage.getItem('labeler') || 'null');
  if (saved) { S.me = saved; try { await load(); return; } catch (e) { /* fall through */ } }
  renderStart();
})();
</script>
