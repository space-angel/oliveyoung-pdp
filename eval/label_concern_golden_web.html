<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골든셋 라벨 도구 (PER-178)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --g50:#F9FAFB; --g100:#F2F4F6; --g200:#E5E8EB; --g300:#D1D6DB; --g400:#B0B8C1; --g500:#8B95A1; --g600:#6B7684; --g700:#4E5968; --g800:#333D4B; --g900:#191F28;
    --blue:#3182F6; --blue-bg:#E8F3FF; --blue-ink:#1B64DA;
    --red:#F04452; --red-bg:#FFEEEE; --red-ink:#D22030;
    --green:#02B26A; --green-bg:#E6F8F0; --green-ink:#018A52;
    --yellow-bg:#FFF6DA; --yellow-ink:#8D6A00;
    --r:16px; --r-s:10px; --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  * { box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body { margin:0; font:15px/1.55 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color:var(--g900); background:var(--g100); letter-spacing:-0.01em; }
  b, strong { font-weight:700; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:.92em; background:var(--g100); padding:1px 6px; border-radius:6px; color:var(--g700); }
  .mute { color:var(--g500); }
  button { font:inherit; letter-spacing:inherit; }

  /* 헤더: 제목 + 숫자 타일 */
  header { display:flex; gap:20px; align-items:center; padding:12px 24px; background:#fff; border-bottom:1px solid var(--g200); position:sticky; top:0; z-index:2; }
  header .title { font-size:18px; font-weight:800; letter-spacing:-0.02em; }
  header .tiles { display:flex; gap:10px; }
  .tile { background:var(--g100); border-radius:12px; padding:6px 14px; min-width:96px; }
  .tile small { display:block; font-size:11px; color:var(--g500); font-weight:600; }
  .tile b { font-size:17px; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }
  header .rule { margin-left:auto; font-size:12px; color:var(--g500); text-align:right; line-height:1.35; }
  .timer { font-variant-numeric:tabular-nums; color:var(--g700); font-weight:600; }

  main { display:grid; grid-template-columns: 260px minmax(420px,1fr) 480px; height: calc(100vh - 61px); gap:0; }
  @media (max-width: 1200px) { main { grid-template-columns: 220px minmax(320px,1fr) 420px; } }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height:auto; } }
  aside, section.reviews, .right { overflow:auto; padding:16px; }
  aside { padding-right:8px; }

  /* 번들 목록 */
  .bundle { display:block; width:100%; text-align:left; padding:12px 14px; margin:0 0 8px; border:1px solid transparent; border-radius:var(--r-s); background:#fff; cursor:pointer; color:inherit; box-shadow:var(--shadow); transition:transform .08s; }
  .bundle:hover { transform:translateY(-1px); }
  .bundle.active { border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-bg); }
  .bundle .bt { display:flex; align-items:center; gap:6px; font-weight:700; }
  .bundle small { display:block; color:var(--g500); font-size:12px; margin-top:2px; }
  .kind { font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px; background:var(--g100); color:var(--g600); }
  .kind.cell { background:var(--blue-bg); color:var(--blue-ink); } .kind.missing { background:var(--yellow-bg); color:var(--yellow-ink); }
  .badge { margin-left:auto; font-size:12px; font-weight:700; color:var(--blue-ink); }
  .prog { height:4px; background:var(--g200); border-radius:2px; margin-top:8px; overflow:hidden; }
  .prog i { display:block; height:100%; background:var(--blue); }

  /* 카드 공통 */
  .card { background:#fff; border-radius:var(--r); padding:16px 18px; box-shadow:var(--shadow); }
  .card + .card { margin-top:12px; }
  h2.s { font-size:13px; font-weight:700; color:var(--g500); margin:0 0 8px; letter-spacing:0; }
  h1.b { font-size:20px; font-weight:800; margin:0; letter-spacing:-0.02em; }

  /* 가운데: 번들 머리 */
  .head .desc { color:var(--g600); font-size:13px; margin-top:4px; }
  .head .scope { margin-top:10px; padding:10px 12px; border-radius:var(--r-s); background:var(--blue-bg); color:var(--blue-ink); font-size:13px; font-weight:600; }
  .head .scope.product { background:var(--g100); color:var(--g700); }
  .filter { display:flex; gap:8px; align-items:center; margin-top:12px; }
  .filter input { flex:1; padding:10px 14px; border:1px solid var(--g200); border-radius:var(--r-s); background:var(--g50); font:inherit; }
  .filter input:focus { outline:none; border-color:var(--blue); background:#fff; }
  .toggle { font-size:13px; color:var(--g700); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .aspects { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip { font-size:13px; padding:5px 11px; border:1px solid var(--g200); border-radius:999px; background:#fff; cursor:pointer; color:var(--g700); }
  .chip b { color:var(--blue-ink); margin-left:2px; } .chip.on { background:var(--g900); color:#fff; border-color:var(--g900); } .chip.on b { color:#fff; } .chip.zero { opacity:.4; }

  /* 리뷰 카드 */
  .review { background:#fff; border-radius:var(--r); padding:16px 18px; margin-top:12px; box-shadow:var(--shadow); border:1px solid transparent; }
  .review.used { border-color:var(--blue); }
  .review.focus { box-shadow:0 0 0 3px var(--blue-bg), var(--shadow); border-color:var(--blue); }
  .review .meta { display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--g500); }
  .review .meta .pill { background:var(--g100); border-radius:999px; padding:2px 8px; color:var(--g600); }
  .review .meta .star { color:#F5A623; letter-spacing:-1px; }
  .review .content { white-space:pre-wrap; margin:10px 0 0; user-select:text; color:var(--g800); font-size:15px; line-height:1.7; }
  .review .content ::selection { background:#FFE58A; }
  mark { background:#FFE58A; padding:0 2px; border-radius:3px; }
  mark.qs { background:var(--blue-bg); color:var(--blue-ink); font-weight:600; }
  mark.qo { background:var(--red-bg); color:var(--red-ink); font-weight:600; }
  .ev-actions { display:none; gap:8px; margin-top:10px; align-items:center; }
  .review.selected .ev-actions { display:flex; }
  .sentences { margin-top:8px; }
  .cand { display:flex; gap:8px; align-items:center; padding:8px 10px; margin-top:6px; border-radius:var(--r-s); background:var(--g50); font-size:14px; color:var(--g800); }
  .cand .txt { flex:1; } .cand.picked { background:var(--blue-bg); }

  /* 버튼 */
  button.primary { background:var(--blue); color:#fff; border:0; border-radius:var(--r-s); padding:13px 16px; font-weight:700; font-size:15px; cursor:pointer; }
  button.primary:hover { background:var(--blue-ink); }
  button.primary.reject { background:#fff; color:var(--red-ink); border:1px solid var(--g200); }
  button.primary.reject:hover { background:var(--red-bg); }
  button.small { font-size:12px; font-weight:700; padding:4px 10px; border:1px solid var(--g200); border-radius:8px; background:#fff; cursor:pointer; color:var(--g700); }
  button.small.positive { color:var(--blue-ink); border-color:var(--blue-bg); background:var(--blue-bg); }
  button.small.negative { color:var(--red-ink); border-color:var(--red-bg); background:var(--red-bg); }

  /* 오른쪽 */
  .right { background:transparent; display:flex; flex-direction:column; gap:12px; }
  .queue .qrow { display:grid; grid-template-columns: 22px 1fr auto; gap:8px; align-items:center; padding:10px 10px; border-radius:var(--r-s); cursor:pointer; font-size:14px; }
  .qrow:hover { background:var(--g50); } .qrow.on { background:var(--blue-bg); } .qrow.done { opacity:.5; }
  .qrow .st { width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; background:var(--g100); color:var(--g500); }
  .qrow .st.ok { background:var(--green-bg); color:var(--green-ink); } .qrow .st.no { background:var(--red-bg); color:var(--red-ink); } .qrow .st.err { background:var(--yellow-bg); color:var(--yellow-ink); }
  .qrow .q { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; color:var(--g800); }
  .qrow .q small { color:var(--g500); font-weight:500; }
  .qrow .w { font-size:12px; color:var(--yellow-ink); font-weight:700; }
  .qrow.human .q { color:var(--blue-ink); }

  .review-panel .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .review-panel .cid { font-weight:800; font-size:13px; color:var(--g500); }
  .tag { font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--g100); color:var(--g700); }
  .tag.mixed { background:var(--yellow-bg); color:var(--yellow-ink); } .tag.positive { background:var(--blue-bg); color:var(--blue-ink); } .tag.negative { background:var(--red-bg); color:var(--red-ink); }
  .review-panel .q { font-size:18px; font-weight:800; letter-spacing:-0.02em; margin:10px 0 4px; line-height:1.4; }
  .review-panel .a { font-size:15px; color:var(--g700); }
  .review-panel .cond { margin-top:8px; font-size:12px; color:var(--g500); }
  .checks { margin-top:12px; display:flex; flex-direction:column; gap:4px; }
  .chk { padding:8px 10px; border-radius:var(--r-s); background:var(--g50); font-size:13px; color:var(--g700); }
  .chk.warn { background:var(--yellow-bg); color:var(--yellow-ink); } .chk.err { background:var(--red-bg); color:var(--red-ink); } .chk.ok { background:var(--green-bg); color:var(--green-ink); }
  .quotes { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .quote { display:grid; grid-template-columns: 4px 1fr; gap:10px; padding:10px 12px; border-radius:var(--r-s); cursor:pointer; background:var(--g50); font-size:14px; }
  .quote:hover { background:var(--g100); }
  .quote .bar { border-radius:2px; background:var(--g300); } .quote.positive .bar { background:var(--blue); } .quote.negative .bar { background:var(--red); }
  .quote .qm { color:var(--g500); font-size:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .quote .qm .stance { font-weight:700; }
  .quote .qt { margin-top:4px; color:var(--g800); line-height:1.55; }
  .quote.missed { cursor:default; } .quote.missed .qm { cursor:pointer; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .hint { font-size:12px; color:var(--g500); margin-top:8px; }

  /* 폼 */
  form { display:flex; flex-direction:column; gap:12px; }
  .srcline { font-size:13px; color:var(--g600); padding:10px 12px; border-radius:var(--r-s); background:var(--g50); }
  label.f { display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:600; color:var(--g500); }
  label.f input, label.f select, label.f textarea { font:inherit; font-weight:500; padding:11px 13px; border:1px solid var(--g200); border-radius:var(--r-s); color:var(--g900); background:#fff; }
  label.f textarea:focus, label.f input:focus, label.f select:focus { outline:none; border-color:var(--blue); }
  textarea { min-height:64px; resize:vertical; line-height:1.5; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .evidence { border-radius:var(--r-s); background:var(--g50); padding:8px 10px; font-size:14px; }
  .evidence .item { display:flex; gap:8px; align-items:flex-start; padding:7px 0; border-bottom:1px solid var(--g200); }
  .evidence .item:last-child { border:0; }
  .stance { font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; white-space:nowrap; }
  .stance.positive { background:var(--blue-bg); color:var(--blue-ink); } .stance.negative { background:var(--red-bg); color:var(--red-ink); }
  .evidence q { flex:1; quotes:none; cursor:pointer; color:var(--g800); }
  .msg { padding:12px 14px; border-radius:var(--r-s); font-size:14px; white-space:pre-wrap; font-weight:600; }
  .msg.err { background:var(--red-bg); color:var(--red-ink); } .msg.ok { background:var(--green-bg); color:var(--green-ink); }
  details.adv summary { cursor:pointer; color:var(--g600); font-size:13px; font-weight:600; padding:6px 0; list-style:none; }
  details.adv summary::before { content:"▸ "; } details.adv[open] summary::before { content:"▾ "; }
  details.adv > div { display:flex; flex-direction:column; gap:12px; margin-top:8px; }
  .labels .l { padding:10px 12px; border-radius:var(--r-s); background:var(--g50); margin-top:8px; font-size:14px; }
  .labels .l b { display:block; } .labels .l .mute { font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips label { font-size:13px; font-weight:500; color:var(--g700); border:1px solid var(--g200); border-radius:999px; padding:4px 10px; cursor:pointer; background:#fff; }
  .chips input { vertical-align:middle; margin:0 4px 0 0; accent-color:var(--blue); }
  .chips .critical { border-color:#FECACA; } .chips .high { border-color:#FDE68A; }
  .chips .tpl { border-style:dashed; } .chips .tpl:hover { background:var(--blue-bg); border-color:var(--blue); }
</style>
</head>
<body>
<header>
  <span class="title">골든셋 라벨</span>
  <div class="tiles" id="tiles"></div>
  <div class="rule">파이프라인 결과·v4 산출물은 보지 않는다 · 번들 밖 리뷰를 보지 않는다 · 방향은 별점이 아니라 문장으로<br>경과 <span class="timer" id="timer">0:00</span></div>
</header>
<main>
  <aside id="bundles"></aside>
  <section class="reviews" id="reviews"><p class="mute">왼쪽에서 번들을 고르세요.</p></section>
  <div class="right" id="right"><p class="mute" style="padding:12px">번들을 고르면 후보 대기열과 폼이 열립니다.</p></div>
</main>
<script>
const $ = (s, r=document) => r.querySelector(s);
const state = { bundleId:null, data:null, evidence:[], startedAt:Date.now(), filter:'', aspect:null,
  source:'human', candidateId:null, snapshot:null, reviewing:null, onlyEvidence:false, highlight:[] };

async function api(path, opt) {
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({error:'응답 파싱 실패'}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function stars(n) { return '★'.repeat(n) + '☆'.repeat(5-n); }

// ---------- 번들 목록 ----------
async function loadBundles() {
  const list = await api('/api/bundles');
  const total = list.reduce((a,b)=>a+b.labels,0);
  const pilot = list.filter(b=>b.phase==='pilot').reduce((a,b)=>a+b.labels,0);
  const cand = list.reduce((a,b)=>a+b.candidates,0);
  $('#tiles').innerHTML = `<div class="tile"><small>라벨</small><b>${total}</b> <span class="mute" style="font-size:12px">/ 100</span></div>
    <div class="tile"><small>파일럿</small><b>${pilot}</b> <span class="mute" style="font-size:12px">/ 40</span></div>
    <div class="tile"><small>번들 착수</small><b>${list.filter(b=>b.labels>0).length}</b> <span class="mute" style="font-size:12px">/ ${list.length}</span></div>
    <div class="tile"><small>후보</small><b>${cand}</b></div>`;
  const kindCls = k => k==='product' ? '' : (k==='missing' ? 'missing' : 'cell');
  $('#bundles').innerHTML = list.map(b => `
    <button class="bundle ${b.bundleId===state.bundleId?'active':''}" data-id="${b.bundleId}">
      <div class="bt">${b.bundleId} <span class="kind ${kindCls(b.scope.kind)}">${b.scope.kind}${b.scope.segment ? ' · '+esc(b.scope.segment) : ''}</span><span class="badge">${b.labels ? b.labels+'건' : ''}</span></div>
      <small>${esc(b.displayName)}</small>
      <small>${b.reviews}리뷰 · ${b.phase}${b.candidates ? ' · 후보 '+b.candidates : ''}</small>
      ${b.candidates ? `<div class="prog"><i style="width:${Math.min(100, Math.round(100*b.labels/Math.max(1,b.candidates+1)))}%"></i></div>` : ''}
    </button>`).join('');
  $('#bundles').querySelectorAll('.bundle').forEach(el => el.onclick = () => openBundle(el.dataset.id));
}

async function openBundle(id) {
  Object.assign(state, { bundleId:id, evidence:[], startedAt:Date.now(), aspect:null, filter:'', source:'human',
    candidateId:null, snapshot:null, reviewing:null, onlyEvidence:false, highlight:[] });
  state.data = await api('/api/bundle/' + id);
  await loadBundles();
  renderReviews(); renderRight();
  // 첫 미결 후보를 자동으로 검수 대상으로
  const next = (state.data.candidates||[]).find(c => !c.decision);
  if (next) reviewCandidate(next.candidateId);
}

// ---------- 가운데: 리뷰 ----------
function renderReviews() {
  const d = state.data, b = d.bundle, s = b.scope;
  const scopeLine = s.axis
    ? `<b>셀 번들</b> — <code>${s.axis}</code> = ${esc(d.scopeLabel)}. 이 번들의 주장은 condition.${s.axis} 에 이 값을 가져야 한다`
    : `<b>제품 번들</b> — 제품 전체 주장. 리뷰별 조건을 보고 조건부 주장을 만들 수도 있다 (근거는 그 세그먼트 리뷰만)`;
  const strata = b.strata.map(x=>`${x.name} ${x.sampled}/${x.population}`).join(' · ');
  $('#reviews').innerHTML = `
    <div class="card head">
      <h1 class="b">${esc(b.displayName)}</h1>
      <div class="desc">${b.bundleId} · ${esc(b.category)} · ${b.productId} · 리뷰 ${d.reviews.length}건 (모집단 ${b.population}, 리센시 통과 · 작성자 1건) · ${b.phase}</div>
      <div class="scope ${s.axis?'':'product'}">${s.axis ? `셀 번들 — ${s.axis} = ${esc(d.scopeLabel)}. 이 번들의 주장은 이 조건을 가져야 합니다` : '제품 번들 — 제품 전체 주장. 리뷰별 조건을 보고 조건부 주장을 만들 수도 있습니다'}</div>
      <div class="filter"><input id="filter" placeholder="단어로 리뷰 걸러 보기 (쉼표로 여러 개)" value="${esc(state.filter||'')}"><span id="filterCount" class="mute" style="font-size:13px;white-space:nowrap"></span>
        <label class="toggle"><input type="checkbox" id="onlyEv" ${state.onlyEvidence?'checked':''}> 근거 리뷰만</label></div>
      <div class="aspects" id="aspects">${Object.entries(d.aspectHits).sort((a,b)=>b[1].reviews-a[1].reviews).map(([a,h])=>`
        <button type="button" class="chip ${state.aspect===a?'on':''} ${h.reviews===0?'zero':''}" data-aspect="${esc(a)}" title="${esc(h.keywords.join(', '))}">${esc(a)}<b>${h.reviews}</b></button>`).join('')}
      </div>
      <div class="hint">근거 추가: 원문을 드래그해서 긍정/부정, 또는 aspect 칩을 눌러 나온 문장 옆 긍정/부정. 입장은 그 문장이 주제에 대해 좋다/나쁘다이고, 방향은 자동으로 계산됩니다.</div>
    </div>
    ${d.reviews.map((r,i)=>`
      <article class="review" data-id="${r.reviewId}" id="rv-${r.reviewId}">
        <div class="meta"><span class="star">${stars(r.rating)}</span><code>${r.reviewId}</code><span>${r.month}</span>${r.conditionLine.split(' · ').map(x=>`<span class="pill">${esc(x)}</span>`).join('')}<span class="pill">${esc(r.author)}</span></div>
        <p class="content">${esc(r.content)}</p>
        <div class="sentences"></div>
        <div class="ev-actions">
          <button type="button" class="small positive" data-stance="positive">긍정 근거로 추가</button>
          <button type="button" class="small negative" data-stance="negative">부정 근거로 추가</button>
          <span class="mute" style="font-size:13px">선택: <q class="sel" style="quotes:none;color:var(--g800)"></q></span>
        </div>
      </article>`).join('')}`;
  const fi = $('#filter');
  fi.oninput = () => { state.filter = fi.value; state.aspect = null; applyFilter(); };
  $('#onlyEv').onchange = e => { state.onlyEvidence = e.target.checked; applyFilter(); };
  $('#aspects').querySelectorAll('.chip').forEach(c => c.onclick = () => pickAspect(c.dataset.aspect));
  $('#reviews').querySelectorAll('.ev-actions button').forEach(btn => btn.onclick = () => {
    const art = btn.closest('.review'); const q = art.querySelector('q.sel').textContent; if (!q) return;

document.addEventListener('selectionchange', () => {

  const node = sel.anchorNode && sel.anchorNode.parentElement; const art = node && node.closest('.review');

function pickAspect(aspect) {
  const hit = state.data.aspectHits[aspect];
  state.aspect = state.aspect === aspect ? null : aspect;
  state.filter = state.aspect ? hit.keywords.join(', ') : '';
  const fi = $('#filter'); if (fi) fi.value = state.filter;
  document.querySelectorAll('#aspects .chip').forEach(c => c.classList.toggle('on', c.dataset.aspect === state.aspect));
  const sel = document.querySelector('[name=aspect]'); if (sel && state.aspect && !sel.value) sel.value = state.aspect;
  renderQuestionTemplates(); applyFilter();
}
function splitSentences(text) {
  const parts = text.split(/(?<=[.!?…~])\s+|\n+/).flatMap(p => p.length > 90 ? p.split(/(?<=,)\s+/) : [p]);
  return parts.map(p => p.trim()).filter(p => p.length >= 4);
}
function markQuotes(html, text, quotes) {
  // 인용 형광펜 — 원문(escaped) 안에서 인용(escaped)을 찾아 감싼다. 입장별 색.
  for (const e of quotes) {
    const q = esc(e.quote); if (!q || !html.includes(q)) continue;
    html = html.split(q).join(`<mark class="${e.stance==='negative'?'qo':'qs'}">${q}</mark>`);
  }
  return html;
}
function applyFilter() {
  const terms = (state.filter||'').split(',').map(t=>t.trim()).filter(Boolean);
  const evIds = new Set(state.evidence.map(e=>e.reviewId));
  const hl = state.evidence;  // 폼에 올라온 근거를 원문에 표시
  let shown = 0; const total = document.querySelectorAll('.review').length;
  document.querySelectorAll('.review').forEach(art => {
    const rid = Number(art.dataset.id);
    const text = state.data.reviews.find(r=>r.reviewId===rid).content;
    let hit = !terms.length || terms.some(t => text.includes(t));
    if (state.onlyEvidence) hit = evIds.has(rid);
    art.hidden = !hit; if (hit) shown++;
    art.classList.toggle('used', evIds.has(rid));
    const p = art.querySelector('.content');
    let h = esc(text);
    const mine = hl.filter(e=>e.reviewId===rid);
    if (mine.length) h = markQuotes(h, text, mine);
    else terms.forEach(t => { if (t) h = h.split(esc(t)).join(`<mark>${esc(t)}</mark>`); });
    p.innerHTML = h;
    const box = art.querySelector('.sentences');
    if (!hit || !terms.length || state.onlyEvidence) { box.innerHTML = ''; return; }
    const used = state.evidence.find(e => e.reviewId === rid);
    const cands = splitSentences(text).filter(sn => terms.some(t => sn.includes(t)));
    box.innerHTML = cands.map(sn => `
      <div class="cand ${used && used.quote === sn ? 'picked' : ''}"><span class="txt">${esc(sn)}</span>
        <button type="button" class="small positive" data-stance="positive">긍정</button>
        <button type="button" class="small negative" data-stance="negative">부정</button></div>`).join('');
    box.querySelectorAll('.cand button').forEach(btn => btn.onclick = () => addEvidence(rid, btn.dataset.stance, btn.closest('.cand').querySelector('.txt').textContent));
  });
  $('#filterCount').textContent = `${shown} / ${total} 리뷰`;
}
function addEvidence(rid, stance, quote) {
  state.evidence = state.evidence.filter(e => e.reviewId !== rid);
  state.evidence.push({reviewId: rid, stance, quote});

  const c = (state.data.candidates||[]).find(x => x.candidateId === state.reviewing);

function focusReview(rid) {

const STOP = new Set(['리뷰','리뷰가','있다','있고','있어요','없다','없어요','같아요','너무','진짜','정말','그냥','조금','좀','이거','이게','사용','제품','느낌','느껴','생겼다는','생기지','않았다는','않았어요','있나요','나요','인가요','하나요','되나요','건가요','사람이']);
function stems(text) {
  // 인용·질문에서 어간 후보를 뽑는다 — 모델 없음. 2~6자 토큰과 그 앞 2자.
  const toks = (text||'').replace(/[^가-힣a-zA-Z0-9\s]/g,' ').split(/\s+/).filter(t => t.length >= 2 && t.length <= 8 && !STOP.has(t));
  const out = new Set();
  toks.forEach(t => { out.add(t.slice(0, Math.min(t.length, 3))); if (t.length >= 4) out.add(t.slice(0, 2)); });
  // 너무 흔한 2자 어간은 뺀다
  ['바르','발라','입술','색이','색은','생각','정도','다른','때문','제가','저는','이번','처음'].forEach(w => out.delete(w));
  return [...out];
}
function renderMissed(c) {
  const box = $('#missed'); if (!box) return;
  const k = c.candidate;
  const aspectWords = (k.aspect && state.data.aspectHits[k.aspect]) ? state.data.aspectHits[k.aspect].keywords : [];
  const qstems = stems([k.question, k.answer, ...(k.evidence||[]).map(e=>e.quote)].join(' '));
  const terms = [...new Set([...aspectWords, ...qstems])].filter(Boolean);
  const evIds = new Set(state.evidence.map(e=>e.reviewId));
  const scored = state.data.reviews.filter(r => !evIds.has(r.reviewId)).map(r => {
    const hitsA = aspectWords.filter(w => r.content.includes(w));
    const hitsQ = qstems.filter(w => r.content.includes(w));
    const sents = splitSentences(r.content).filter(sn => hitsA.some(w=>sn.includes(w)) || hitsQ.some(w=>sn.includes(w)));
    return { r, score: hitsA.length * 2 + hitsQ.length, hits: [...new Set([...hitsA, ...hitsQ])], sents: sents.slice(0, 3) };
  }).filter(x => x.score > 0 && x.sents.length).sort((a,b)=>b.score-a.score).slice(0, 8);
  if (!scored.length) { box.innerHTML = `<div class="hint">같은 얘기를 하는 다른 리뷰가 문자열 매칭으로는 보이지 않습니다 — aspect 칩·단어 필터로 확인하세요</div>`; return; }
  box.innerHTML = `
    <h2 class="s" style="margin-top:14px">놓쳤을 수 있는 근거 ${scored.length}개 리뷰 <span style="font-weight:500" title="${esc(terms.join(', '))}">· 같은 단어를 말하는 리뷰. 문장 옆 긍정/부정으로 추가</span></h2>
    <div class="quotes">${scored.map(x => `
      <div class="quote missed" data-rid="${x.r.reviewId}"><span class="bar" style="background:#fde68a"></span>
        <div><div class="qm"><code>${x.r.reviewId}</code><span>${stars(x.r.rating)}</span><span>${esc(x.r.conditionLine)}</span><span>매칭 ${x.hits.slice(0,4).map(esc).join('·')}</span></div>
          ${x.sents.map(sn => `<div class="cand"><span class="txt">${esc(sn)}</span>
            <button type="button" class="small positive" data-rid="${x.r.reviewId}" data-stance="positive">긍정</button>
            <button type="button" class="small negative" data-rid="${x.r.reviewId}" data-stance="negative">부정</button></div>`).join('')}
        </div></div>`).join('')}</div>`;
  box.querySelectorAll('.cand button').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    addEvidence(Number(b.dataset.rid), b.dataset.stance, b.closest('.cand').querySelector('.txt').textContent);
    renderMissed(c);
  });
  box.querySelectorAll('.quote.missed .qm').forEach(m => m.onclick = () => focusReview(Number(m.closest('.quote').dataset.rid)));
}

  f.querySelector('[name=cond_skinType]').value = cond.skinType || (s.axis==='skinType' ? s.segment : '');
  f.querySelector('[name=cond_option]').value = cond.option || (s.axis==='option' ? s.segment : '');
  f.querySelectorAll('[name=trouble],[name=trouble_missing]').forEach(cb => cb.checked = Array.isArray(cond.skinTrouble) ? cond.skinTrouble.includes(cb.value) : (s.axis==='skinTrouble' && s.segment===cb.value));
  f.querySelectorAll('[name=fail]').forEach(cb => cb.checked = false);
  f.querySelector('[name=notes]').value = ''; f.querySelector('[name=minutesSpent]').value = '';
  renderEvidence(); renderQuestionTemplates(); setSrcLine(); showMsg('', '');
}
function derived() {
  const authors = new Map(state.data.reviews.map(r=>[r.reviewId, r.author]));
  const u = st => new Set(state.evidence.filter(e=>e.stance===st).map(e=>authors.get(e.reviewId))).size;
  const p = u('positive'), n = u('negative');
  return p && n ? 'mixed' : (p ? 'positive' : 'negative');
}
function silentCount() {
  const authors = new Map(state.data.reviews.map(r=>[r.reviewId, r.author]));
  const spoke = new Set(state.evidence.map(e=>authors.get(e.reviewId)));
  return new Set(state.data.reviews.map(r=>r.author)).size - spoke.size;
}
function renderEvidence() {
  const box = $('#evidence'); if (!box) return;
  const authors = new Map(state.data.reviews.map(r=>[r.reviewId, r.author]));
  const uniq = st => new Set(state.evidence.filter(e=>e.stance===st).map(e=>authors.get(e.reviewId))).size;
  box.innerHTML = state.evidence.length ? state.evidence.map((e,i)=>`
    <div class="item"><span class="stance ${e.stance}">${e.stance}</span><code>${e.reviewId}</code><q data-rid="${e.reviewId}">${esc(e.quote)}</q>
      <button type="button" class="small" data-flip="${i}" title="입장 바꾸기">⇄</button><button type="button" class="small" data-i="${i}">✕</button></div>`).join('') +
    `<div class="mute" style="font-size:12px;margin-top:4px">고유 작성자 긍정 ${uniq('positive')} · 부정 ${uniq('negative')} → 방향 <b>${derived()}</b> (자동) · <span title="주제를 언급하지 않은 작성자. 긍정도 부정도 아니다 — 답에서 '대부분 없다'로 세지 않는다">언급 없음 ${silentCount()}</span> · N_min ${state.data.vocab.nMin} 은 참고값</div>`
    : '<span class="mute">아직 없음 — 가운데에서 드래그하거나 문장 옆 S/O</span>';
  const dir = document.querySelector('[name=direction]'); if (dir) dir.value = state.evidence.length ? derived() : '';
  box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { state.evidence.splice(Number(b.dataset.i),1); renderEvidence(); applyFilter(); });
  box.querySelectorAll('[data-flip]').forEach(b => b.onclick = () => { const e = state.evidence[Number(b.dataset.flip)]; e.stance = e.stance==='positive'?'negative':'positive'; renderEvidence(); applyFilter(); });
  box.querySelectorAll('q[data-rid]').forEach(q => q.onclick = () => focusReview(Number(q.dataset.rid)));
}
function renderQuestionTemplates() {
  const box = $('#qtpl'); if (!box) return;
  const aspect = document.querySelector('[name=aspect]')?.value || state.aspect;
  const tpls = (state.data.questionTemplates || {})[aspect] || [];
  box.innerHTML = tpls.map(t => `<label class="tpl">${esc(t)}</label>`).join('');
  box.querySelectorAll('.tpl').forEach(el => el.onclick = () => { const q = document.querySelector('[name=question]'); q.value = el.textContent; q.focus(); });
}
function normalizedForm() {
  const fd = new FormData($('#form'));
  const cond = axis => { const x = fd.get('cond_'+axis); return x === '' ? null : x; };
  const troubles = fd.getAll('trouble'); const tm = fd.get('trouble_missing');
  return { aspect: fd.get('aspect') || null, question: (fd.get('question')||'').trim(), answer: (fd.get('answer')||'').trim(),
    condition: { skinType: cond('skinType'), skinTrouble: tm ? [tm].concat(troubles) : (troubles.length ? troubles : null), option: cond('option') },
    direction: state.evidence.length ? derived() : 'positive', evidence: state.evidence };
}
function showMsg(text, cls) { const m = $('#msg'); if (!m) return; m.className = text ? 'msg ' + cls : ''; m.textContent = text; }

async function save() {
  const fd = new FormData($('#form'));
  const nf = normalizedForm();
  let source = state.source;
  if (source === 'candidate_accepted' && state.snapshot && JSON.stringify(nf) !== state.snapshot) source = 'candidate_edited';
  const minutesRaw = fd.get('minutesSpent');
  const elapsed = Math.max(0.5, Math.round((Date.now()-state.startedAt)/60000*2)/2);
  const payload = { ...nf, source, candidateId: source === 'human' ? null : state.candidateId,
    labelId: fd.get('labelId').trim(), bundleId: state.bundleId, productId: state.data.bundle.productId,
    failureReasons: fd.getAll('fail'), evaluation: fd.get('evaluation'), notes: fd.get('notes') || null,
    minutesSpent: minutesRaw ? Number(minutesRaw) : elapsed };
  try {
    const r = await api('/api/labels', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    const keep = `저장됨 ${r.label.labelId} [${r.label.source}] · ${r.label.direction} — 긍정 ${r.counts.positiveAuthors} / 부정 ${r.counts.negativeAuthors} / 언급 없음 ${r.counts.silentAuthors}${r.label.failureReasons.length?' · '+r.label.failureReasons.join(', '):''}`;
    await openBundle(state.bundleId);
    showMsg(keep, 'ok');
  } catch (e) { showMsg('저장하지 않았다 — ' + e.message, 'err'); }
}

setInterval(() => { const s = Math.floor((Date.now()-state.startedAt)/1000); $('#timer').textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }, 1000);
loadBundles().catch(e => { $('#bundles').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; });
</script>
</body>
